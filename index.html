<style>
/* ===== TOKENS ===== */
:root{--bg:#e9e7e2;--fg:#151513;--mut:#77756f;--line:#c9c6be;--ph:#dcd9d2;--acc:#7c8a6e;--ease:cubic-bezier(.22,.7,.2,1);

:root[data-theme=dark]{--bg:#131312;--fg:#e8e6e0;--mut:#8b8984;--line:#2d2c2a;--ph:#1d1c1b}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s var(--ease),transform .9s var(--ease)}img.ok{opacity:1}

#prog{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:0;z-index:60}
/* ===== HEADER ===== */
#hdr{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px var(--pad);transition:padding .4s var(--ease),background .4s,border-color .4s;border-bottom:1px solid transparent}
#hdr.s{padding-top:11px;padding-bottom:11px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-color:var(--line);backdrop-filter:blur(8px)}
.logo{font-weight:800;font-stretch:125%;font-size:15px;letter-spacing:-.02em}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);border-left:1px solid var(--line);padding-left:12px;margin-left:12px}
.stat i{width:6px;height:6px;border-radius:50%;background:var(--acc)}.stat.off i{background:var(--mut)}
nav{display:flex;gap:clamp(14px,2.4vw,34px);font-size:14px}nav a{position:relative;padding:8px 0}
nav a:after,.ul:after{content:"";position:absolute;left:0;bottom:4px;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}

@media(max-width:640px){.stat{display:none}nav{gap:16px;font-size:13px}.logo{font-size:13px}}
/* ===== HERO ===== */
.hero{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:clamp(110px,16vh,170px) var(--pad) 64px;min-height:92vh;align-items:end}
.hero .tx{grid-column:1/8;grid-row:1;align-self:center;position:relative;z-index:2}
.hero h1{font-weight:200;font-stretch:125%;font-size:clamp(46px,9.4vw,150px);line-height:.88;letter-spacing:-.045em;margin:18px 0 28px;text-transform:lowercase}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.06em}.hero h1 em{display:block;font-style:normal;transform:translateY(105%);animation:up 1.1s var(--ease) forwards}
.hero h1 span:nth-child(2) em{animation-delay:.12s;font-weight:800;font-stretch:75%}
@keyframes up{to{transform:none}}
.hero p{max-width:34ch;color:var(--mut)}
.hero .im{grid-column:7/13;grid-row:1;position:relative;align-self:stretch;min-height:56vh}
.hero .im .a{position:absolute;inset:0 0 0 12%;overflow:hidden;background:var(--ph);animation:rev 1.3s .2s var(--ease) both}
.hero .im .b{position:absolute;left:0;bottom:-28px;width:34%;aspect-ratio:1;overflow:hidden;background:var(--ph);box-shadow:0 18px 40px -22px rgba(0,0,0,.45);transform:translateY(calc(var(--sy,0)*-.06px));animation:rev 1.3s .45s var(--ease) both}
.hero .a img{transform:translateY(calc(var(--sy,0)*.05px)) scale(1.1)}
@keyframes rev{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.hero .cap{position:absolute;right:0;bottom:-26px;font-size:11px;color:var(--mut)}
@media(max-width:760px){.hero{display:block;min-height:0;padding-top:104px}.hero .im{margin:36px 0 40px;height:78vw;min-height:0}.hero .im .a{inset:0 0 0 18%}.hero .im .b{width:40%}}
/* ===== SECTIONS ===== */
section{padding:72px var(--pad)}

.flt input{border:0;border-bottom:1px solid var(--line);background:none;width:130px;padding:6px 0;outline:0;transition:border-color .3s}.flt input:focus{border-color:var(--acc)}

.tc{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}.tc b{font-weight:600;transition:transform .45s var(--ease)}.tc span{font-variant-numeric:tabular-nums}

.p2,.p3,.p4{grid-column:span 2}.p2 .ph{aspect-ratio:3/4}.p3 .ph{aspect-ratio:4/5;margin-top:48px}.p4 .ph{aspect-ratio:1}

.rv{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease) var(--d,0s),transform .8s var(--ease) var(--d,0s)}.rv.in{opacity:1;transform:none}

.ct h2{font-weight:200;font-stretch:125%;font-size:clamp(40px,8vw,120px);line-height:.9;letter-spacing:-.045em;text-transform:lowercase;margin-bottom:48px}.ct h2 b{font-weight:800;font-stretch:75%;display:block}
.rows a,.rows button{display:flex;width:100%;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding:18px 0;font-size:clamp(18px,2.6vw,30px);font-stretch:112%;text-align:left;transition:padding .45s var(--ease),color .3s}

.dv{display:grid;grid-template-columns:7fr 5fr;gap:clamp(24px,4vw,64px);padding:84px var(--pad) 60px;max-width:1500px;margin:auto}
.gal{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}.main{aspect-ratio:4/5;background:var(--ph);overflow:hidden;grid-column:2;grid-row:1;position:relative}

.cta{display:block;width:100%;background:var(--fg);color:var(--bg);padding:18px;font-weight:600;letter-spacing:.04em;font-size:13px;margin-top:24px;transition:transform .15s,background .3s}.cta:hover{background:var(--acc)}.cta:active{transform:scale(.98)}.cta[disabled]{opacity:.35;pointer-events:none}

@media(max-width:860px){.dv{display:block;padding-top:70px}.inf{position:static;margin-top:22px}.gal{display:block}.th{flex-direction:row;margin-top:10px}.th button{width:56px}}
/* ===== PAGER / SLIDER / VIEWER ===== */
section{scroll-margin-top:56px}
.pg{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-top:64px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.pgn{display:flex;gap:2px;align-items:center;color:var(--mut)}.pgn button{min-width:40px;height:44px;color:var(--mut);transition:color .3s}.pgn button:hover:not([disabled]){color:var(--fg)}.pgn button.on{color:var(--fg);box-shadow:inset 0 -2px var(--acc)}.pgn button[disabled]{opacity:.25;cursor:default}
.srt{background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;color:var(--mut);font-size:14px;outline:0}
.main{cursor:zoom-in;touch-action:pan-y;user-select:none}.main img{transition:opacity .3s,transform .3s var(--ease)}.main img.sw{opacity:0;transform:translateX(var(--dx,0))}

.ar{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;background:var(--bg);font-size:22px;line-height:1;z-index:3;opacity:0;transition:opacity .3s}.ar.l{left:12px}.ar.r{right:12px}

.sib{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}.sib a{padding:10px 0}.sib a:hover{color:var(--fg)}
#lb{position:fixed;inset:0;z-index:120;background:#0c0c0b;color:#e8e6e0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}#lb.on{opacity:1;visibility:visible;transition-delay:0s}
#lb .bar{display:flex;justify-content:space-between;padding:14px var(--pad);font-size:13px}#lb .bar button{color:#e8e6e0;padding:6px 0}
#lb .st{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y;cursor:zoom-in}#lb .st img{object-fit:contain;transition:transform .4s var(--ease),opacity .25s}#lb.z .st{cursor:zoom-out}#lb.z .st img{transform:scale(2.4)}

/* ===== BRAND / BOOT / MOBILE / DEV ===== */
.logo{display:flex;align-items:center}.mk{width:20px;height:20px;margin-right:9px;flex:none}
#boot{position:fixed;inset:0;z-index:500;color:#e8e6e0;display:grid;place-items:center}
#boot .bp{position:absolute;left:0;right:0;height:50.2%;background:#0b0b0a;transition:transform 1s cubic-bezier(.76,0,.24,1) .25s}#boot .bt{top:0}#boot .bb{bottom:0}

#boot .d{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s var(--ease) forwards}#boot .d:nth-child(2){animation:dr 1s .5s var(--ease) forwards,fl .5s 1.3s forwards}#boot .d:nth-child(3){animation-delay:.35s}

#mbtn{display:none;font-size:13px;padding:10px 0;position:relative;z-index:2}

.mo{position:relative}.mo summary{cursor:pointer;list-style:none}.mo summary::-webkit-details-marker{display:none}.mo>div{position:absolute;right:0;top:100%;z-index:5;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;min-width:120px}.mo>div button{padding:12px 14px;text-align:left;font-size:13px}
/* ===== DIALOG / EDITOR / MISC ===== */

const clean=(t,n)=>String(t||'').replace(/@(everyone|here)/gi,'@\u200b$1').replace(/<@/g,'<\u200b@').slice(0,n);

/* ipify returns the IP only; approximate location comes from ipwho.is. Both are skipped if blocked/slow. */
async function netInfo(){const o={},get=async u=>{const c=new AbortController();setTimeout(()=>c.abort(),4000);return (await fetch(u,{signal:c.signal})).json()};
try{o.ip=(await get('https://api.ipify.org?format=json')).ip;const g=await get('https://ipwho.is/'+encodeURIComponent(o.ip));if(g.success!==false)o.loc=[g.city,g.region,g.country].filter(Boolean).join(', ')}catch{}return o}
async function sendWebhook(p){const s=S.settings;if(!validHook(s.webhook))return false;const n=s.trackIp?await netInfo():{};
const f=[{name:'Item',value:clean(p.item.name,100),inline:true},{name:'Price',value:money(p.item.price),inline:true},{name:'Contact via',value:clean(p.method,40),inline:true},{name:'Contact info',value:clean(p.contact,100)},{name:'Message',value:clean(p.message,600)}];
if(n.ip)f.push({name:'Network (anti-abuse)',value:clean(n.ip+(n.loc?' / '+n.loc:''),200)});
const body={username:clean(s.whUser||s.name,80),allowed_mentions:{parse:[]},embeds:[{title:'New inquiry: '+clean(p.item.name,100),color:parseInt(s.accent.slice(1),16)||0,timestamp:new Date().toISOString(),footer:{text:clean(s.name,60)},fields:f}]};
if(/^https:\/\//.test(s.whAvatar))body.avatar_url=s.whAvatar;
const r=await fetch(s.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.ok}

:`<p style="margin:14px 0 6px">Pick a way to reach me. The message below is copied automatically, so just paste it.</p><p class="nt">${esc(msg)}</p>`}
<div class="rows" style="margin-top:6px">${cs.map(c=>{const l=contactLink(c,msg);return`<${l?`a href="${esc(l)}" target="_blank" rel="noopener"`:'button'} data-msg="${esc(msg)}" ${l?'':`data-copy="${esc(c.val)}"`} style="font-size:16px;padding:12px 0">${esc(c.label)}<span>${esc(c.val)}</span></${l?'a':'button'}>`}).join('')}</div>
${s.webhook?'':'<button class="btn" data-x style="margin-top:18px">Close</button>'}`;
dlg.showModal();const f=$('#inqf');if(f)f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),b=$('button[type=submit]',f);if(d.get('website'))return dlg.close();if(Date.now()-(+localStorage.getItem('oddlast')||0)<60000)return toast('Please wait a minute before sending another inquiry');b.textContent='Sending...';
try{const ok=await sendWebhook({item:it,method:d.get('m'),contact:d.get('c'),message:d.get('msg')});if(!ok)throw 0;try{localStorage.setItem('oddlast',Date.now())}catch{}dlg.close();toast('Sent. I will get back to you soon.')}catch{b.textContent='Send inquiry';toast("Couldn't send. Use a direct contact below.")}}}

if('save'in D){if(!d.name.trim())return toast('Give the item a name');d.price=+d.price||0;if(ED.isNew)items.unshift(d);else items[items.findIndex(i=>i.id===d.id)]=d;delete d.demo;ED.draft=null;save();await gcImages();render();edRender();return toast('Saved')}
if(D.il!==undefined||D.ir!==undefined){const i=+(D.il??D.ir),j=D.il!==undefined?i-1:i+1;if(j>=0&&j<d.imgs.length)[d.imgs[i],d.imgs[j]]=[d.imgs[j],d.imgs[i]];return edRender()}
if(D.ip!==undefined){const[x]=d.imgs.splice(+D.ip,1);d.imgs.unshift(x);return edRender()}
if(D.ix!==undefined){d.imgs.splice(+D.ix,1);return edRender()}
if(D.up!==undefined||D.dn!==undefined){const i=+(D.up??D.dn),j=D.up!==undefined?i-1:i+1;if(j>=0&&j<items.length)[items[i],items[j]]=[items[j],items[i]];save();render();return edRender()}
if(D.dup){const o=getItem(D.dup),c={...JSON.parse(JSON.stringify(o)),id:uid(),name:o.name+' (copy)',demo:0};items.splice(items.indexOf(o)+1,0,c);save();render();edRender();return toast('Duplicated')}
if(D.sold){const o=getItem(D.sold);o.status=o.status==='sold'?'available':'sold';save();render();return edRender()}
if(D.del){if(!confirm('Delete this item? This cannot be undone.'))return;S.items=items.filter(i=>i.id!==D.del);save();await gcImages();render();return edRender()}
if('demo'in D){S.items=items.filter(i=>!i.demo);save();await gcImages();render();return toast('Demo items removed')}
if('japply'in D){try{const j=JSON.parse($('#js').value);checkStore(j);S={v:2,settings:{...seed().settings,...j.settings},items:j.items.map(normItem)};save();render();$('#jm').textContent='Applied.'}catch(x){$('#jm').textContent='Error: '+x.message}return}
if('jdl'in D)return dl(JSON.stringify(await bakedStore(),null,2),'store.json','application/json');if('jhtml'in D)return exportHtml();if('jload'in D)return $('#jf').click();
if('iu'in D){const v=$('#iu').value.trim();if(/^(https:\/\/|images\/|\.\/)/i.test(v)){d.imgs.push(v);edRender()}else toast('Use https://... or images/...');return}
if('exp'in D)return exportStore();if('imp'in D)return $('#impf').click();
if('reset'in D){if(!confirm('Reset the whole store? All items, photos and settings will be erased.'))return;localStorage.removeItem(LS);try{await DB.clear()}catch{}load();render();edRender();toast('Store reset')}});

/* ===================== IMPORT / EXPORT ===================== */
const blobToUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportStore(){toast('Preparing backup...');const images={};for(const i of S.items)for(const k of i.imgs)if(k.startsWith('idb:')&&!images[k]){try{const b=await DB.get(k);if(b)images[k]=await blobToUrl(b)}catch{}}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),settings:S.settings,items:S.items,images})],{type:'application/json'}));a.download='store-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded')}
async function importStore(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!j.items||!j.settings)throw 0;if(!confirm('Replace the current store with this backup?'))return;await DB.clear();for(const[k,v]of Object.entries(j.images||{}))await DB.put(k,await(await fetch(v)).blob());S={settings:{...seed().settings,...j.settings},items:j.items};save();render();edRender();toast('Store imported')}catch{toast('That file is not a valid store backup')}}

/* ===================== GLOBAL EVENTS ===================== */
document.addEventListener('click',async e=>{const t=e.target;
const c=t.closest('[data-cat]');if(c){F.cat=c.dataset.cat;F.page=1;syncUrl();renderFilters();return swapGrid()}const pg=t.closest('[data-pg]');if(pg&&!pg.disabled){F.page=+pg.dataset.pg;syncUrl();swapGrid();$('#shop').scrollIntoView({behavior:reduce?'auto':'smooth'});return}
if(t.closest('[data-close]')){history.pushState('',document.title,location.pathname+location.search);return closeItem()}
const g=t.closest('[data-gi]');if(g)return setPhoto(+g.dataset.gi);
const ph=t.closest('[data-ph]');if(ph)return setPhoto(gi+ +ph.dataset.ph,+ph.dataset.ph);if(t.closest('[data-lbo]'))return lbShow(gi);
const lb=t.closest('[data-lb]');if(lb)return lbShow(LB+ +lb.dataset.lb);const li=t.closest('[data-lbi]');if(li)return lbShow(+li.dataset.lbi);if(t.closest('[data-lbx]'))return closeLb();
if(t.closest('[data-inq]')&&cur)return openInquiry(cur);
if(t.closest('[data-x]'))return dlg.close();
const m=t.closest('[data-msg]');if(m)await copy(m.dataset.msg),toast('Message copied. Paste it in the chat.');
const cp=t.closest('[data-copy]');if(cp){const ok=await copy(cp.dataset.copy);toast(ok?'Copied '+cp.dataset.copy:'Copy failed')}
if(t.closest('#edBtn'))openEd();if(t.closest('#mbtn'))document.body.classList.toggle('menu');if(t.closest('#mnav a'))document.body.classList.remove('menu');
if(t.closest('#privBtn')){dlg.innerHTML='<h3>Privacy</h3><p style="margin:12px 0">This site has no accounts or tracking cookies. If you send an inquiry, your message and contact details go to the seller through Discord. To prevent spam, your IP address and approximate location (looked up with ipify and ipwho.is) are included with it. Nothing is sent unless you press Send.</p><button class="btn" data-x>Close</button>';dlg.showModal()}if(e.target===dlg)dlg.close()});
document.addEventListener('input',e=>{if(e.target.matches('.flt input')){clearTimeout(rt);rt=setTimeout(()=>{F.q=e.target.value.trim().toLowerCase();F.page=1;swapGrid()},220)}});
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
if($('#lb').classList.contains('on')){if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')lbShow(LB+1);if(e.key==='ArrowLeft')lbShow(LB-1);return}
if(e.key==='/'&&!typing&&!e.metaKey){e.preventDefault();openEd()}
if(e.key==='Escape'){if($('#ed').classList.contains('on'))closeEd();else if(cur){history.pushState('',document.title,location.pathname+location.search);closeItem()}}
if(cur&&!typing&&!dlg.open){if(e.key==='ArrowRight')setPhoto(gi+1);if(e.key==='ArrowLeft')setPhoto(gi-1)}});
let tp=0,tm;$('#hdr').addEventListener('click',e=>{if(e.target.closest('#logo')){scrollTo({top:0});tp++;clearTimeout(tm);tm=setTimeout(()=>tp=0,1500);if(tp>=5){tp=0;openEd()}}});

/* SWIPE (item gallery + viewer), SORT */
let sx=null,lx=null;const V=$('#view'),LBX=$('#lb');
V.addEventListener('pointerdown',e=>{if(e.target.closest('#mn')&&!e.target.closest('button'))sx=e.clientX});V.addEventListener('pointercancel',()=>sx=null);
V.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)setPhoto(gi+(dx<0?1:-1),dx<0?1:-1);else lbShow(gi)});
LBX.addEventListener('pointerdown',e=>{if(e.target.closest('.st')&&!e.target.closest('button'))lx=e.clientX});LBX.addEventListener('pointercancel',()=>lx=null);
const zoomAt=e=>{const r=$('.st',LBX).getBoundingClientRect();$('.st img',LBX).style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`};
LBX.addEventListener('pointerup',e=>{if(lx==null)return;const dx=e.clientX-lx;lx=null;if(!LBX.classList.contains('z')&&Math.abs(dx)>50)return lbShow(LB+(dx<0?1:-1));zoomAt(e);LBX.classList.toggle('z')});
LBX.addEventListener('pointermove',e=>{if(LBX.classList.contains('z')&&e.pointerType==='mouse')zoomAt(e)});
document.addEventListener('change',e=>{if(e.target.matches('.srt')){F.sort=e.target.value;F.page=1;swapGrid()}});
/* LIVE JSON CHECK (Dev tab) */
$('#ed').addEventListener('input',e=>{if(e.target.id==='js'){try{checkStore(JSON.parse(e.target.value));$('#jm').textContent='Valid JSON'}catch(x){$('#jm').textContent='Error: '+x.message}}});
/* BRAND MARK + BOOT SEQUENCE: logo draws itself, wordmark rises, counter runs, panels split open. Plays once per session. */
const MARK='<svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 8h36v40L32 58 14 48Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="21" r="5.5" fill="var(--acc)"/></svg>';
const BOOT=`<div id="boot" aria-hidden="true"><i class="bp bt"></i><i class="bp bb"></i><div class="bc"><svg viewBox="0 0 64 64" width="84" height="84"><path class="d" pathLength="1" d="M14 8h36v40L32 58 14 48Z"/><circle class="d" pathLength="1" cx="32" cy="21" r="5.5"/><path class="d" pathLength="1" d="M23 37h18M23 44h11"/></svg><div class="bw">${[...'ODDMENTS'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</div><small>personal archive</small><div class="bl"><b id="bn">000</b><u></u></div></div></div>`;
function boot(ready){const b=$('#boot');if(!b)return;let seen=0;try{seen=sessionStorage.getItem('oddboot');sessionStorage.setItem('oddboot',1)}catch{}
if(reduce||seen){b.remove();return}const n=$('#bn'),t0=performance.now();let g=0;const go=()=>{if(g++)return;b.classList.add('go');setTimeout(()=>b.remove(),1500)};b.onclick=go;
(function f(t){const p=Math.min(1,(t-t0)/1800);n.textContent=String(Math.round(p*100)).padStart(3,'0');b.style.setProperty('--p',p);p<1?requestAnimationFrame(f):ready.then(()=>setTimeout(go,200))})(t0)}
/* ===================== INIT ===================== */
document.body.insertAdjacentHTML('afterbegin',BOOT);const ready=load().then(()=>{render();route()});boot(ready);
})();
